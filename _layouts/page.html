---
layout: default
---
<header class="page-head">
  <div class="container container--narrow">
    <h1 class="page-head__title page-head__title--sm">{{ page.title }}</h1>
    {% if page.description %}<p class="page-head__lede">{{ page.description }}</p>{% endif %}
  </div>
</header>
<div class="container container--narrow">
  <div class="prose content">
    {{ content }}
  </div>
  {% if page.comments and site.disqus_shortname %}<section id="disqus_thread"></section>{% endif %}
</div>
