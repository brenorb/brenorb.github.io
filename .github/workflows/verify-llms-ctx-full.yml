name: Verify site assets

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  verify-site-assets:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1.3
          bundler-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Check sources and regenerate generated files
        run: scripts/check_sources.sh

      - name: Verify generated files are up to date
        run: git diff --exit-code -- _includes/generated llms-ctx-full.txt

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build

      - name: Check built site
        run: scripts/check_build.sh
