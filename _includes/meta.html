{% assign post_tags = page.tags | default: page.tag %}
<div class="post-meta">
  {% if post_tags %}
  <ul class="tags">
    {% for tag in post_tags %}<li><a class="tag" href="{{ '/tags/' | relative_url }}#{{ tag | slugify }}">#{{ tag }}</a></li>{% endfor %}
  </ul>
  {% endif %}
  <a class="share" href="https://twitter.com/intent/tweet?text={{ page.title | url_encode }}&amp;url={{ site.url }}{{ page.url }}">Share on X ↗</a>
</div>
