<br>
<hr>
{% assign post_tags = page.tags | default: page.tag %}
{% if post_tags %}
<span class="entry-tags">{% for tag in post_tags %}<a href="{{ '/tags/' | relative_url }}#{{ tag | slugify }}" title="Pages tagged {{ tag }}" class="tag"><span class="term">{{ tag }}</span></a>{% endfor %}</span>
{% endif %}
<span class="social-share">
    <a href="https://twitter.com/intent/tweet?text={{ page.url | absolute_url | url_encode }}" title="Share on Twitter" class="tag">
        <span class="term"><i class="fa fa-twitter-square" aria-hidden="true"></i> Tweet</span>
    </a>
</span>
<div style="clear:both"></div>
