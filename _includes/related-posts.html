{% assign related_pages = site.data.related_posts.pages[page.url] %}
{% if related_pages and related_pages.size > 0 %}
<section class="related-posts" aria-labelledby="related-posts-title">
    <h2 id="related-posts-title">Related pages</h2>
    <ul>
        {% for related in related_pages %}
        <li><a href="{{ related.url | relative_url }}">{{ related.title | escape }}</a></li>
        {% endfor %}
    </ul>
</section>
{% endif %}
