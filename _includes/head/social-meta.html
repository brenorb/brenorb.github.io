{% comment %}Twitter Card and Open Graph tags. Uses variables computed in head.html.{% endcomment %}
    <!-- Twitter Cards -->
    <meta name="twitter:card" content="{% if feature_image %}summary_large_image{% else %}summary{% endif %}">
    <meta name="twitter:image" content="{{ page_image }}">
    <meta name="twitter:title" content="{{ seo_title }}">
    <meta name="twitter:description" content="{{ page_description | escape_once }}">
    {% if site.twitter %}<meta name="twitter:site" content="@{{ site.twitter }}">
    <meta name="twitter:creator" content="@{{ site.twitter }}">{% endif %}
    <!-- Open Graph -->
    <meta property="og:locale" content="{{ page_locale }}">
    <meta property="og:type" content="{% if is_article %}article{% else %}website{% endif %}">
    <meta property="og:title" content="{{ seo_title }}">
    <meta property="og:description" content="{{ page_description | escape_once }}">
    <meta property="og:url" content="{{ canonical_url }}">
    <meta property="og:site_name" content="{{ site.title }}">
    <meta property="og:image" content="{{ page_image }}">
    {% if is_article %}
    <meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">
    <meta property="article:modified_time" content="{{ page_last_modified | date_to_xmlschema }}">
    {% endif %}
